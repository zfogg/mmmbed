name: Documentation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - name: Install documentation toolchain
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/mmmbed-docs"
          uv pip install --python "$RUNNER_TEMP/mmmbed-docs/bin/python" -r docs/api/requirements.txt
      - name: Build documentation
        run: "$RUNNER_TEMP/mmmbed-docs/bin/sphinx-build --keep-going -b html -c docs/api . build/docs/html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
