name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-latest}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: amd64, runner: macos-15, cc: 'clang -arch x86_64'}
          - {goos: darwin, goarch: arm64, runner: macos-15}
          - {goos: windows, goarch: amd64, runner: windows-latest, msystem: MINGW64, msys_bin: mingw64, packages: 'mingw-w64-x86_64-gcc zip', cc: gcc}
          - {goos: windows, goarch: arm64, runner: windows-11-arm, msystem: CLANGARM64, msys_bin: clangarm64, packages: 'mingw-w64-clang-aarch64-toolchain zip', cc: clang}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        if: matrix.goos == 'windows'
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.packages }}
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          MSYS_BIN: ${{ matrix.msys_bin }}
          CC_OVERRIDE: ${{ matrix.cc }}
        run: |
          set -eu
          if [ -n "${MSYS_BIN:-}" ]; then export PATH="/c/msys64/$MSYS_BIN/bin:/c/msys64/usr/bin:$PATH"; fi
          if [ -n "${CC_OVERRIDE:-}" ]; then export CC="$CC_OVERRIDE"; fi
          name="mmmbed_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p dist/stage
          binary=mmmbed
          if [ "$GOOS" = windows ]; then binary=mmmbed.exe; fi
          go build -trimpath -o "dist/stage/$binary" ./cmd/mmmbed
          cp README.md LICENSE dist/stage/
          if [ "$GOOS" = windows ]; then
            (cd dist/stage && zip -q "../$name.zip" "$binary" README.md LICENSE)
          else
            tar -C dist/stage -czf "dist/$name.tar.gz" "$binary" README.md LICENSE
          fi
          rm -rf dist/stage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --generate-notes
