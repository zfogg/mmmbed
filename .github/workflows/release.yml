name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -eu
          name="mmmbed_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p dist/stage
          binary=mmmbed
          if [ "$GOOS" = windows ]; then binary=mmmbed.exe; fi
          go build -trimpath -o "dist/stage/$binary" ./cmd/mmmbed
          cp README.md LICENSE dist/stage/
          if [ "$GOOS" = windows ]; then
            (cd dist/stage && zip -q "../$name.zip" "$binary" README.md LICENSE)
          else
            tar -C dist/stage -czf "dist/$name.tar.gz" "$binary" README.md LICENSE
          fi
          rm -rf dist/stage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --generate-notes
